name: Build Windows release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag to update (for example, v1.0)"
        required: true
        default: "v1.0"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Test, build, and publish Windows application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Resolve and validate release tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $tag = "${{ inputs.release_tag }}".Trim()
          }
          elseif ("${{ github.event_name }}" -eq "release") {
              $tag = "${{ github.event.release.tag_name }}".Trim()
          }
          else {
              $tag = $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v\d+\.\d+(?:\.\d+)?$') {
              throw "Release tag must look like v1.0, v1.0.1, v1.1.0, or v2.0.0. Received: $tag"
          }
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate Windows executable
        shell: pwsh
        run: .\build_windows.ps1 -Version "${{ steps.version.outputs.release_tag }}" -SkipDependencyInstall -SkipTests

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: Chess-Repertoire-Memorizer-${{ steps.version.outputs.release_tag }}-Windows
          path: release/Chess-Repertoire-Memorizer-${{ steps.version.outputs.release_tag }}-Windows.zip
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if (-not $releaseExists) {
              if ("${{ github.event_name }}" -eq "workflow_dispatch") {
                  throw "No GitHub Release exists for $env:RELEASE_TAG. Create it first or enter an existing release tag."
              }
              gh release create $env:RELEASE_TAG `
                  --repo $env:GITHUB_REPOSITORY `
                  --verify-tag `
                  --title "Chess Repertoire Memorizer $env:RELEASE_TAG" `
                  --generate-notes
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not create the GitHub Release for $env:RELEASE_TAG."
              }
          }

          gh release upload $env:RELEASE_TAG `
              "release/Chess-Repertoire-Memorizer-$env:RELEASE_TAG-Windows.zip" `
              --repo $env:GITHUB_REPOSITORY `
              --clobber
          if ($LASTEXITCODE -ne 0) {
              throw "Could not attach the Windows assets to release $env:RELEASE_TAG."
          }
